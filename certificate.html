<header class="reg-hero"><div class="wrap" style="max-width:1000px">

</div></header>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/certificate.js?v=2026k"></script>
<script>
(function () {
    var ENDPOINT = 'https://sfo.cloud.appwrite.io/v1', PROJECT = '6aae02ba003620a19dd0';
    var id = new URLSearchParams(location.search).get('id') || '';
    var sub = document.getElementById('c-sub');
    function fail(text) { sub.textContent = text; }
    if (!/^[A-Za-z0-9_.-]{8,36}$/.test(id)) return fail('This certificate link is incomplete. Please use the full link from your email.');

    fetch(ENDPOINT + '/functions/expo-api/executions', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Appwrite-Project': PROJECT },
        body: JSON.stringify({ body: JSON.stringify({ action: 'getCertificate', id: id }), async: false, method: 'POST', headers: { 'content-type': 'application/json' } })
    }).then(function (r) { return r.json(); }).then(function (ex) {
        var out = JSON.parse(ex.responseBody || '{}');
        if (!out.ok) return fail(out.message || 'We could not find that certificate.');
        var c = out.certificate;
        document.title = c.recipientName + ' — ' + (c.eventName || 'IgniteAI Expo') + ' certificate';
        document.getElementById('c-event').textContent = c.eventName || 'IgniteAI Expo';
        sub.textContent = ExpoCert.TITLES[c.kind] + ' for ' + c.recipientName + '. Congratulations!';
        return ExpoCert.draw(c).then(function (cv) {
            cv.style.cssText = 'width:100%;height:auto;border-radius:6px;box-shadow:0 20px 50px -20px rgba(22,24,29,.4)';
            document.getElementById('c-canvas').appendChild(cv);
            document.getElementById('c-actions').hidden = false;
            var save = function (blob, name) { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
            document.getElementById('c-pdf').addEventListener('click', function () { ExpoCert.pdf(c).then(function (b) { save(b, ExpoCert.filename(c)); }); });
            document.getElementById('c-png').addEventListener('click', function () { cv.toBlob(function (b) { save(b, ExpoCert.filename(c).replace('.pdf', '.png')); }); });
        });
    }).catch(function () { fail('Something went wrong loading this certificate. Please try again in a moment.'); });
})();
</script>
