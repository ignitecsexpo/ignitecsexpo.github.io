<!DOCTYPE html>
<html lang="en">
<head>

<body class="portal">

<div class="p-shell" id="shell" hidden>
    <aside class="p-side">

            <a data-tab="registrations">Registrations <b id="n-reg"></b></a>

            <a data-tab="seasons">Seasons</a>
            <a data-tab="settings">Settings</a>

        <div class="p-user">
            <strong id="who"></strong><span id="who-email"></span><br>

<div id="loading" style="padding:80px;text-align:center;color:var(--muted)">Loading the portal…</div>
<div id="drawer-host"></div>
